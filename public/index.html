<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lastiara | Digital Anatomy</title>
    <style>
      :root {
        --bg: #050505;
        --glass: rgba(255, 255, 255, 0.035);
        --glass-strong: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.09);
        --text-main: #fcfcfc;
        --text-dim: rgba(252, 252, 252, 0.56);
        --accent: #f7c600;
        --accent-soft: rgba(247, 198, 0, 0.14);
        --danger: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.07), transparent 34%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 48%),
          var(--bg);
        color: var(--text-main);
        font-family:
          Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 700px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding: 2rem 2rem 1.25rem;
      }

      .brand {
        min-width: 0;
      }

      .brand h1 {
        margin: 0;
        background: linear-gradient(90deg, #fff 0%, var(--accent) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .brand p {
        margin: 0.35rem 0 0;
        color: var(--text-dim);
        font-size: 0.7rem;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .status {
        flex: 0 0 auto;
        color: var(--text-dim);
        font-size: 0.65rem;
        letter-spacing: 0;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .status.ready {
        color: var(--accent);
      }

      .status.error {
        color: var(--danger);
      }

      .chat {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 2rem;
        scrollbar-width: none;
      }

      .chat::-webkit-scrollbar {
        display: none;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-height: 100%;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 100%;
        margin-bottom: 2rem;
      }

      .message.user {
        align-items: flex-end;
      }

      .message.agent {
        align-items: flex-start;
      }

      .label {
        color: var(--text-dim);
        font-size: 0.65rem;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .bubble {
        max-width: min(85%, 720px);
        padding: 1.2rem;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--glass);
        backdrop-filter: blur(20px);
        font-size: 0.95rem;
        font-weight: 300;
        line-height: 1.6;
        letter-spacing: 0;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .message.user .bubble {
        border-color: transparent;
        border-radius: 20px 20px 0 20px;
        background: var(--accent);
        color: #000;
        font-weight: 450;
      }

      .message.agent .bubble {
        border-radius: 20px 20px 20px 0;
        background: var(--glass);
        color: var(--text-main);
      }

      .composer-wrap {
        padding: 1.25rem 2rem 2rem;
      }

      .composer {
        display: flex;
        gap: 0.5rem;
        border: 1px solid var(--border);
        border-radius: 30px;
        background: var(--glass);
        backdrop-filter: blur(20px);
        padding: 0.5rem;
      }

      #question {
        flex: 1;
        min-width: 0;
        height: 50px;
        max-height: 160px;
        resize: vertical;
        border: 0;
        background: transparent;
        color: #fff;
        outline: none;
        padding: 1rem;
        font-size: 0.9rem;
      }

      #question:focus {
        box-shadow: none;
      }

      #question::placeholder {
        color: rgba(255, 255, 255, 0.38);
      }

      #send {
        flex: 0 0 auto;
        min-width: 86px;
        border: 0;
        border-radius: 25px;
        background: var(--accent);
        color: var(--bg);
        cursor: pointer;
        font-weight: 700;
        padding: 0 1.35rem;
        transition:
          transform 0.2s ease,
          opacity 0.2s ease;
      }

      #send:active {
        transform: scale(0.96);
      }

      #send:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }

      .empty {
        margin-top: 3rem;
        color: var(--text-dim);
        font-size: 0.9rem;
        text-align: center;
      }

      @media (max-width: 640px) {
        .app {
          border: 0;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .topbar {
          padding: 1rem;
        }

        .chat {
          padding: 0 1rem;
        }

        .composer-wrap {
          padding: 1rem;
        }

        .composer {
          border-radius: 22px;
        }

        .bubble {
          max-width: 100%;
        }

        #send {
          min-width: 72px;
          padding: 0 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <h1>Lastiara</h1>
          <p>Digital Anatomy</p>
        </div>
        <div id="status" class="status">System Online</div>
      </header>

      <section class="chat" aria-live="polite">
        <div id="messages" class="messages">
          <article class="message agent">
            <div class="bubble">Querying database... waiting for input.</div>
          </article>
        </div>
      </section>

      <form id="form" class="composer-wrap">
        <div class="composer">
          <textarea
            id="question"
            name="question"
            placeholder="Ask your data..."
            autocomplete="off"
            required
          ></textarea>
          <button id="send" type="submit">SEND</button>
        </div>
      </form>
    </main>

    <script>
      const form = document.querySelector('#form')
      const questionInput = document.querySelector('#question')
      const sendButton = document.querySelector('#send')
      const messages = document.querySelector('#messages')
      const statusBadge = document.querySelector('#status')

      let hasMessages = false

      checkHealth()

      form.addEventListener('submit', async (event) => {
        event.preventDefault()

        const question = questionInput.value.trim()
        if (!question) return

        addMessage('user', 'You', question)
        questionInput.value = ''
        setLoading(true)

        const pending = addMessage('agent', 'Coze', 'Thinking... complex workflow queries may take 1-3 minutes.')

        try {
          await streamAnswer(question, pending.querySelector('.bubble'))
        } catch (error) {
          pending.querySelector('.bubble').textContent = error.message
        } finally {
          setLoading(false)
          questionInput.focus()
        }
      })

      questionInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
          form.requestSubmit()
        }
      })

      async function checkHealth() {
        try {
          const response = await fetch('/api/health')
          const data = await response.json()

          if (data.agent?.configured) {
            statusBadge.textContent = 'Coze configured'
            statusBadge.classList.add('ready')
            statusBadge.classList.remove('error')
            return
          }

          statusBadge.textContent = 'Coze API pending'
          statusBadge.classList.remove('ready', 'error')
        } catch {
          statusBadge.textContent = 'Local API offline'
          statusBadge.classList.add('error')
          statusBadge.classList.remove('ready')
        }
      }

      async function streamAnswer(question, bubble) {
        const response = await fetch('/api/chat-stream', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ question }),
        })

        if (!response.ok || !response.body) {
          const data = await response.json().catch(() => ({}))
          throw new Error(data.error || 'Request failed')
        }

        const reader = response.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ''
        let answer = ''

        while (true) {
          const { value, done } = await reader.read()
          if (done) break

          buffer += decoder.decode(value, { stream: true })
          const events = buffer.split(/\n\n|\r\n\r\n/)
          buffer = events.pop() || ''

          for (const rawEvent of events) {
            const event = parseSseEvent(rawEvent)
            if (!event.data) continue

            const payload = JSON.parse(event.data)

            if (event.event === 'delta') {
              answer += payload.text || ''
              answer = cleanAnswerText(answer)
              bubble.textContent = answer
              bubble.scrollIntoView({ block: 'end', behavior: 'smooth' })
            }

            if (event.event === 'error') {
              throw new Error(payload.error || 'Stream failed')
            }
          }
        }

        if (!answer.trim()) {
          bubble.textContent = 'No answer returned.'
        }
      }

      function parseSseEvent(rawEvent) {
        const event = { event: '', data: '' }

        for (const line of rawEvent.split(/\r?\n/)) {
          if (line.startsWith('event:')) {
            event.event = line.slice(6).trim()
          }

          if (line.startsWith('data:')) {
            event.data += line.slice(5).trim()
          }
        }

        return event
      }

      function cleanAnswerText(text) {
        return text
          .replace(/经过解读与整理，?反馈给用户一份工整的报告[。.]?/g, '')
          .replace(/下面我将为你生成一份报告[。.]?/g, '')
          .replace(/我将以工整的报告形式反馈[。.]?/g, '')
          .replace(/以下是整理后的结果[：:]?[。.]?/g, '')
          .replace(/为您呈现如下[：:]?[。.]?/g, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim()
      }

      function addMessage(type, label, text) {
        if (!hasMessages) {
          messages.textContent = ''
          hasMessages = true
        }

        const item = document.createElement('article')
        item.className = `message ${type}`

        const labelNode = document.createElement('div')
        labelNode.className = 'label'
        labelNode.textContent = label

        const bubble = document.createElement('div')
        bubble.className = 'bubble'
        bubble.textContent = text

        item.append(labelNode, bubble)
        messages.append(item)
        item.scrollIntoView({ block: 'end', behavior: 'smooth' })

        return item
      }

      function setLoading(isLoading) {
        sendButton.disabled = isLoading
        questionInput.disabled = isLoading
        sendButton.textContent = isLoading ? 'WAIT' : 'SEND'
      }
    </script>
  </body>
</html>
