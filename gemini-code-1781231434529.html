<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lastiara | Database Assistant</title>
    <style>
        :root {
            --bg: #050505;
            --surface: #0f0f0f;
            --border: #262626;
            --text-main: #e5e5e5;
            --text-dim: #a3a3a3;
            --accent: #F7C600; /* 职场金 */
            --blue: #003366;
        }

        * { box-sizing: border-box; }
        body, html { height: 100%; margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        .app { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

        .topbar { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
        .brand { font-weight: 700; letter-spacing: -0.5px; color: var(--text-main); }
        .status { font-size: 0.8rem; color: var(--text-dim); }

        .chat { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .messages { display: flex; flex-direction: column; gap: 1.5rem; }

        .message { display: flex; flex-direction: column; gap: 0.5rem; max-width: 100%; }
        .message.user { align-items: flex-end; }
        .message.agent { align-items: flex-start; }

        .label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.5px; }
        .bubble { padding: 1rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.6; max-width: 85%; word-wrap: break-word; }
        .message.user .bubble { background: var(--blue); color: #fff; }
        .message.agent .bubble { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); }

        .composer-wrap { padding: 1.5rem; background: var(--bg); border-top: 1px solid var(--border); }
        .composer { display: flex; gap: 0.75rem; }
        #question { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text-main); padding: 0.75rem; border-radius: 6px; outline: none; resize: none; height: 48px; }
        #question:focus { border-color: var(--accent); }
        #send { background: var(--accent); color: var(--bg); border: none; padding: 0 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
        
        .empty { text-align: center; color: var(--text-dim); margin-top: 4rem; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app">
    <div class="topbar">
        <div class="brand">LASTIARA</div>
        <div id="status" class="status">Initializing...</div>
    </div>

    <div class="chat">
        <div id="messages" class="messages">
            <div class="empty">Connect to database and start your query.</div>
        </div>
    </div>

    <form id="form" class="composer-wrap">
        <div class="composer">
            <textarea id="question" placeholder="Ask about the database..." required></textarea>
            <button id="send" type="submit">QUERY</button>
        </div>
    </form>
</div>

<script>
    /* 你的现有 JavaScript 逻辑保持不变 */
</script>
</body>
</html>
